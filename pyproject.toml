[project]
name = "harnessclaw"
version = "0.1.0"
description = "A personal assistant you message from Discord, with a memory every AI tool can share"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.4",
    "httpx>=0.27",
    "mcp>=2.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.6.0"]

[project.scripts]
harnessclaw = "harnessclaw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# discord.py imports audioop for voice, which this project doesn't use.
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]
