# HarnessClaw redaction configuration.
# Missing file => defaults (secrets on, PII off). Set enabled: false to disable
# redaction entirely without editing wiring.

enabled: true

categories:
  anthropic_key: true
  openai_key: true
  github_token: true
  aws_access_key: true
  aws_secret_key: true
  gcp_key: true
  slack_webhook: true
  jwt: true
  ssh_private_key: true
  email: false
  phone_us: false
  credit_card: false
  ssn_us: false
  user_path: false

